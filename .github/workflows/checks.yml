name: Core calculation and XML checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile core modules and UI
        run: python -m py_compile main.py calculator.py data_manager.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
